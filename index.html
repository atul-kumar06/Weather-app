<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

  <title>Frontend Mentor | Weather app</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="navBar">
    <img src="./assets/images/logo.svg" alt="logo" />
    <button class="switch-btn">
      <img src="./assets/images/icon-units.svg" alt="" />
      <span>Units</span>
      <img src="./assets/images/icon-dropdown.svg" alt="" />
    </button>
  </header>
  <h1 class="heading-line">How's the sky looking today?</h1>
  <section class="search-container">
    <div class="search-bar">
      <img src="./assets/images/icon-search.svg" alt="">
      <input type="text" placeholder="Search for a place....">
    </div>
    <button>Search</button>
  </section>

  <section class="weather-dashboard">

    <div class="right-dashboard">
      <div class="weather-info">
        <div class="country-location">
          <p class="country-name">Berlin,Germany</p>
          <p>Tuesday,Aug,2025</p>
        </div>
        <div class="country-temp">
          <img src="./assets/images/icon-rain.webp" alt="">
          <div class="country-temp-value">
            <span>20</span><span>&deg;</span>
          </div>
        </div>
      </div>

      <div class="weather-card-container">
        <div class="weather-card">
          <p class="weather-details">Feels Like</p>
          <div class="weather-temp">
            <span class="weather-value">18</span><span>&deg;</span>
          </div>
        </div>
        <div class="weather-card">
          <p class="weather-details">Humadity</p>
          <div class="weather-temp">
            <span class="weather-value">46</span><span>%</span>
          </div>
        </div>
        <div class="weather-card">
          <p class="weather-details">Wind</p>
          <div class="weather-temp">
            <span class="weather-value">14</span>
            <span>Km/h</span>
          </div>
        </div>
        <div class="weather-card">
          <p class="weather-details">Perception</p>
          <div class="weather-temp">
            <span class="weather-value">0</span>
            <span>mm</span>
          </div>
        </div>
      </div>
      <h3 class="forcast-heading">Daily Forecast</h3>
    </div>



    <div class="left-dashboard"></div>
  </section>

  <script src="app.js" type="module"></script>
</body>

</html>
