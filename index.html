  <header class="navbar">
    <img src="./assets/images/logo.svg" alt="Weather App Logo" class="logo" />
    <div class="unit-container">
      <button class="switch-btn">
        <img src="./assets/images/icon-units.svg" alt="setting-icon" />
        <span>Units</span>
        <img src="./assets/images/icon-dropdown.svg" alt="dropdown-icon" class="unit-dropdown-icon" />
      </button>
      <div class="unit-value">
        <button class="convertor-btn">Switch to Imperial</button>

        <div class="value-selected">
          <p>Temperature</p>
          <ul>
            <li class="unit-value-selected">
              Celsius <span>(&deg;C)</span><img src="./assets/images/icon-checkmark.svg" alt="" />
            </li>
            <li>Fahrenheit <span>(&deg;</span><span>F)</span></li>
            <li class="selected-border"></li>
          </ul>
        </div>

        <div class="value-selected">
          <p>Wind Speed</p>
          <ul>
            <li>Km/h</li>
            <li>mph</li>
            <li class="selected-border"></li>
          </ul>
        </div>

        <div class="value-selected">
          <p>Precipitation</p>
          <ul>
            <li>Milimeters <span>(mm)</span></li>
            <li>Inches(in)</li>
          </ul>
        </div>
      </div>
    </div>
  </header>
