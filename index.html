<body>
  <header class="navbar">
    <img src="./assets/images/logo.svg" alt="Weather App Logo" class="logo" />

    <!-- Unit Selector Component -->
    <div class="unit-menu">
      <button type="button" class="unit-menu__trigger" aria-haspopup="true" aria-expanded="false"
        aria-controls="unit-dropdown">
        <img src="./assets/images/icon-units.svg" alt="" aria-hidden="true" />
        <span>Units</span>
        <img src="./assets/images/icon-dropdown.svg" alt="" aria-hidden="true" class="unit-menu__arrow" />
      </button>

      <!-- Dropdown Menu -->
      <div id="unit-dropdown" class="unit-dropdown" role="region" aria-label="Unit preferences">
        <button type="button" class="unit-dropdown__system-btn">
          Switch to Imperial
        </button>

        <!-- Temperature -->
        <div class="unit-group" data-unit-category="temperature">
          <span class="unit-group__title">Temperature</span>
          <ul class="unit-group__list">
            <li>
              <button type="button" class="unit-option unit-option--selected" data-unit="metric"
                data-unit-value="celsius">
                <span>Celsius (&deg;C)</span>
                <img src="./assets/images/icon-checkmark.svg" alt="Selected" class="unit-option__check" />
              </button>
            </li>
            <li>
              <button type="button" class="unit-option" data-unit="imperial" data-unit-value="fahrenheit">
                <span>Fahrenheit (&deg;F)</span>
                <img src="./assets/images/icon-checkmark.svg" alt="Selected" class="unit-option__check" />
              </button>
            </li>
          </ul>
        </div>

        <!-- Wind Speed -->
        <div class="unit-group" data-unit-category="windSpeed">
          <span class="unit-group__title">Wind Speed</span>
          <ul class="unit-group__list">
            <li>
              <button type="button" class="unit-option unit-option--selected" data-unit="metric" data-unit-value="kmh">
                <span>km/h</span>
                <img src="./assets/images/icon-checkmark.svg" alt="Selected" class="unit-option__check" />
              </button>
            </li>
            <li>
              <button type="button" class="unit-option" data-unit="imperial" data-unit-value="mph">
                <span>mph</span>
                <img src="./assets/images/icon-checkmark.svg" alt="Selected" class="unit-option__check" />
              </button>
            </li>
          </ul>
        </div>

        <!-- Precipitation -->
        <div class="unit-group" data-unit-category="precipitation">
          <span class="unit-group__title">Precipitation</span>
          <ul class="unit-group__list">
            <li>
              <button type="button" class="unit-option unit-option--selected" data-unit="metric" data-unit-value="mm">
                <span>Millimeters (mm)</span>
                <img src="./assets/images/icon-checkmark.svg" alt="Selected" class="unit-option__check" />
              </button>
            </li>
            <li>
              <button type="button" class="unit-option" data-unit="imperial" data-unit-value="in">
                <span>Inches (in)</span>
                <img src="./assets/images/icon-checkmark.svg" alt="Selected" class="unit-option__check" />
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>
