<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Weather app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <img src="./assets/images/logo.svg" alt="logo" />
      <button class="switch-btn">
        <img src="./assets/images/icon-units.svg" alt="" />
        <span>Switch to Imperial</span>
        <img src="./assets/images/icon-dropdown.svg" alt="" />
      </button>
    </header>
    <main>
      <h1 class="heading-line">How's the sky looking today?</h1>

      <div class="search-btn">
        <div class="search-btn-inside">
          <div class="search-btn-input">
            <img src="./assets/images/icon-search.svg" alt="Search" />
            <input type="text" placeholder="Search for a place... " />
          </div>
          <button>Search</button>
        </div>
      </div>

      <section class="main-container">
        <div class="left" style="background-color: red">
          <div class="left-container">
            <div class="left-items"></div>
            <div class="left-items"></div>
          </div>
        </div>
        <div class="right" style="background-color: pink"></div>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
